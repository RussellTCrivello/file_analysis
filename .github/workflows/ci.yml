name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (ruff)
        run: ruff check --no-cache --exit-zero Api apps core database reader_file settings pipeline concurrency
      - name: Security scan (bandit, high severity only fails)
        run: |
          pip install bandit
          bandit -r Api apps core database reader_file settings pipeline -lll -q || true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[pdf,office,dev]"
      - name: Unit tests
        env:
          FLASK_SECRET_KEY: ci-test-secret-key-not-for-production-use
        run: pytest tests/unit -v
      - name: Integration + security + e2e tests (disposable PostgreSQL via pgserver)
        env:
          FLASK_SECRET_KEY: ci-test-secret-key-not-for-production-use
        run: pytest tests/integration tests/security tests/e2e -v

  readiness:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[pdf,office,dev]"
      - name: Readiness verification (behavioral)
        run: python verify_readiness.py --json > readiness-report.json
      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: readiness-report
          path: readiness-report.json
